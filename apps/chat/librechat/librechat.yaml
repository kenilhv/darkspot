# DarkSpot LibreChat config. Mounted into the librechat container at /app/librechat.yaml.
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.2.1
cache: true

# Every model turn goes through the DarkSpot guard proxy (apps/chat/proxy), which
# injects the Rule 1 system prompt and runs the deterministic guard on the output.
# The proxy's own upstream (inference.net / Anthropic) is set via UPSTREAM_* env.
endpoints:
  custom:
    - name: "DarkSpot (guarded)"
      apiKey: "darkspot-proxy"            # proxy ignores it; upstream key lives on the proxy, not in LibreChat
      baseURL: "http://darkspot-proxy:3312/v1"
      # LibreChat does not interpolate ${VAR} in this file - verified live, must be a real model id.
      models:
        default: ["meta-llama/Llama-3.3-70B-Instruct"]
        fetch: false
      titleConvo: false                    # title generation would be an unguarded model call
      modelDisplayLabel: "DarkSpot"
      dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]

# LibreChat blocks private hostnames for MCP unless listed here (mcpSettings.allowedAddresses).
mcpSettings:
  allowedAddresses:
    - "darkspot-tools:3311"

# Coordinator tools (apps/chat/tools) — evidence only, fail closed until CORE's views exist.
mcpServers:
  darkspot:
    type: streamable-http
    url: "http://darkspot-tools:3311/mcp"
    timeout: 60000
    # D-14: the caller identity the tool server maps to CORE's principals.external_subject. Set server-side by
    # LibreChat from the authenticated session — never from anything the user types. Requires sse/streamable-http.
    headers:
      X-DarkSpot-Subject: "{{LIBRECHAT_USER_ID}}"
      X-DarkSpot-Subject-Email: "{{LIBRECHAT_USER_EMAIL}}"
      # LibreChat does NOT interpolate ${VAR} anywhere in this file - only the {{...}} session
      # variables above are real. ${TOOLS_SHARED_SECRET} was reaching the tool server as a literal
      # 24-char string, auth failed silently, and LibreChat logged "0 tools" with no error - this
      # is why chat could never call get_priority_ranking etc. Value below must match .env exactly.
      X-DarkSpot-Tools-Token: "fd86ee42a5e529f9f2fb69d7f6c7fceb348372d72a798c94"
    serverInstructions: true
